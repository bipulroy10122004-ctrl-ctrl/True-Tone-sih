<div class="result-box" id="resultBox">
  <div class="result-verdict" id="resultVerdict">
    <span id="verdictText">CLASSIFYING...</span>
    <span class="threat-action-pill" id="actionPill">ACTION</span>
  </div>

  <div class="meter-container">
    <div class="meter-labels">
      <span>Deepfake Spoof Risk</span>
      <span id="spoofPercentLabel" style="font-weight: 700; font-family: var(--font-mono);">0.0%</span>
    </div>
    <div class="meter-bar-bg">
      <div class="meter-fill" id="meterFill"></div>
    </div>
  </div>

  <div class="result-stats-row">
    <div class="stat-item">
      <div class="stat-name">Threat Severity</div>
      <div class="stat-val" id="riskLevelVal">-</div>
    </div>
    <div class="stat-item">
      <div class="stat-name">Total Latency</div>
      <div class="stat-val" id="latencyVal">-</div>
    </div>
    <div class="stat-item">
      <div class="stat-name">IP Firewall Status</div>
      <div class="stat-val" id="ipActionVal">-</div>
    </div>
  </div>
</div>
